<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>腹部多器官分割 · 在线演示</title>
<style>
  :root{
    --bg:#0e1116; --panel:#171b22; --panel2:#1f242d; --line:#2a3140;
    --text:#e6e9ee; --dim:#8b95a5; --accent:#4ecdc4; --accent2:#ff6b6b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  .app{display:flex;flex-direction:column;height:100vh}

  header{display:flex;align-items:center;gap:16px;padding:12px 20px;
    border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.5px}
  header .sub{font-size:12px;color:var(--dim)}
  header .spacer{flex:1}

  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);
    padding:7px 14px;border-radius:6px;font-size:13px;cursor:pointer;transition:.15s}
  .btn:hover{background:#2a3140;border-color:#3a4457}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.primary{background:var(--accent);color:#07211f;border-color:var(--accent);font-weight:600}
  .btn.primary:hover{filter:brightness(1.1)}

  main{flex:1;display:flex;min-height:0}

  /* 左：控制面板 */
  aside{width:290px;border-right:1px solid var(--line);background:var(--panel);
    display:flex;flex-direction:column;overflow-y:auto}
  .sec{padding:14px 16px;border-bottom:1px solid var(--line)}
  .sec h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);
    margin:0 0 10px;font-weight:600}

  .drop{border:2px dashed var(--line);border-radius:10px;padding:22px 12px;text-align:center;
    cursor:pointer;transition:.2s}
  .drop:hover,.drop.over{border-color:var(--accent);background:rgba(78,205,196,.06)}
  .drop b{display:block;font-size:13px;margin-bottom:5px}
  .drop span{font-size:11px;color:var(--dim)}

  .demo-list{display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:14px;
    padding:4px 10px;font-size:12px;cursor:pointer}
  .chip:hover{border-color:var(--accent);color:var(--accent)}

  .row{display:flex;align-items:center;justify-content:space-between;margin:8px 0;font-size:13px}
  .row label{color:var(--dim)}
  input[type=range]{width:100%;accent-color:var(--accent);margin:6px 0}
  .seg{display:flex;gap:4px;background:var(--panel2);padding:3px;border-radius:7px}
  .seg button{flex:1;border:0;background:transparent;color:var(--dim);padding:6px 4px;
    border-radius:5px;font-size:12px;cursor:pointer}
  .seg button.on{background:var(--accent);color:#07211f;font-weight:600}
  .val{color:var(--accent);font-variant-numeric:tabular-nums;font-size:12px}

  /* 器官列表 */
  .organ{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px}
  .swatch{width:12px;height:12px;border-radius:3px;flex:0 0 auto;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
  .organ .nm{flex:1}
  .organ .vol{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}

  /* 中：主视图 */
  .viewer{flex:1;display:flex;flex-direction:column;min-width:0;background:#0a0c10}
  .stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;
    position:relative;padding:12px}
  .stage img{max-width:100%;max-height:100%;object-fit:contain;image-rendering:auto;
    border-radius:4px;box-shadow:0 8px 40px rgba(0,0,0,.6)}
  .placeholder{text-align:center;color:var(--dim)}
  .placeholder .big{font-size:44px;margin-bottom:12px;opacity:.35}

  .bar{display:flex;align-items:center;gap:14px;padding:10px 18px;
    border-top:1px solid var(--line);background:var(--panel)}
  .bar .z{font-variant-numeric:tabular-nums;font-size:13px;color:var(--dim);min-width:100px}
  .bar input[type=range]{flex:1}

  /* 进度 */
  .progress{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:8px}
  .progress > div{height:100%;background:var(--accent);width:0;transition:width .3s}
  .status{font-size:12px;color:var(--dim);margin-top:6px;min-height:16px}

  /* 右：缩略图 */
  .strips{width:96px;border-left:1px solid var(--line);background:var(--panel);
    overflow-y:auto;padding:6px}
  .strips img{width:100%;display:block;margin-bottom:4px;border-radius:3px;cursor:pointer;
    opacity:.55;transition:.15s;border:1px solid transparent}
  .strips img:hover{opacity:1}
  .strips img.cur{opacity:1;border-color:var(--accent)}
  .warnbar{display:none;align-items:center;gap:10px;padding:10px 20px;
    background:#3a2a12;border-bottom:1px solid #6b4a1e;color:#ffd88a;font-size:13px}
  .warnbar.on{display:flex}
  .warnbar b{color:#ffb84d}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:#2a3140;border:1px solid var(--line);padding:10px 18px;border-radius:8px;
    font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:99}
  .toast.on{opacity:1}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>腹部多器官分割</h1>
    <span class="sub">DICOM 上传 · 三维推理 · 逐层滚动查看</span>
    <span class="spacer"></span>
    <span class="sub" id="modelInfo">等待载入</span>
  </header>

  <div class="warnbar" id="warnbar"><b>⚠ 注意</b><span id="warntext"></span></div>

  <main>
    <!-- 左面板 -->
    <aside>
      <div class="sec">
        <h2>上传影像</h2>
        <div class="drop" id="drop">
          <b>拖入 DICOM 压缩包</b>
          <span>或点击选择 .zip / .nii / .nii.gz</span>
        </div>
        <input type="file" id="file" hidden accept=".zip,.nii,.gz">
        <div class="progress" id="progWrap" style="display:none"><div id="prog"></div></div>
        <div class="status" id="status"></div>
      </div>

      <div class="sec">
        <h2>演示病例（无需上传）</h2>
        <div class="demo-list" id="demoList"></div>
      </div>

      <div class="sec">
        <h2>显示设置</h2>
        <div class="row"><label>叠加模式</label></div>
        <div class="seg" id="modeSeg">
          <button data-v="both" class="on">填充+轮廓</button>
          <button data-v="fill">填充</button>
          <button data-v="contour">仅轮廓</button>
        </div>
        <div class="row"><label>透明度</label><span class="val" id="alphaV">0.45</span></div>
        <input type="range" id="alpha" min="0" max="1" step="0.05" value="0.45">
        <div class="row"><label>窗位 WL / 窗宽 WW</label><span class="val" id="wlV">40 / 400</span></div>
        <input type="range" id="wl" min="-200" max="300" step="5" value="40">
        <input type="range" id="ww" min="50" max="1500" step="10" value="400">
        <div class="demo-list" style="margin-top:8px">
          <span class="chip" data-win="40,400">腹部软组织</span>
          <span class="chip" data-win="60,600">宽窗</span>
          <span class="chip" data-win="0,1500">骨窗</span>
        </div>
        <div class="row" style="margin-top:10px">
          <label>显示分割</label>
          <input type="checkbox" id="showMask" checked style="accent-color:var(--accent)">
        </div>
      </div>

      <div class="sec" id="organSec" style="display:none">
        <h2>识别结果 · 体积</h2>
        <div id="organList"></div>
      </div>
    </aside>

    <!-- 中：主视图 -->
    <div class="viewer">
      <div class="stage" id="stage">
        <div class="placeholder" id="ph">
          <div class="big">🩻</div>
          <div>上传 DICOM 压缩包，或点击左侧演示病例</div>
        </div>
        <img id="slice" style="display:none" alt="slice">
      </div>
      <div class="bar">
        <span class="z" id="zLabel">— / —</span>
        <input type="range" id="zSlider" min="0" max="0" value="0" disabled>
      </div>
    </div>

    <!-- 右：缩略图 -->
    <div class="strips" id="strips"></div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const state = { caseId:null, n:0, z:0, mode:'both', alpha:0.45, wl:40, ww:400,
                showMask:true, cache:new Map(), pending:null };

function toast(msg, ms=1800){
  const t=$('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'), ms);
}

/* ---------------- 切片加载（带预取与缓存） ---------------- */
function sliceURL(z){
  const p = new URLSearchParams({mode:state.mode, alpha:state.alpha,
    wl:state.wl, ww:state.ww, show_mask:state.showMask});
  return `/api/case/${state.caseId}/slice/${z}?${p}`;
}
function loadSlice(z){
  if(!state.caseId) return;
  z = Math.max(0, Math.min(state.n-1, z));
  state.z = z;
  $('zSlider').value = z;
  $('zLabel').textContent = `${z+1} / ${state.n}`;

  const key = sliceURL(z);
  let url = state.cache.get(key);
  if(!url){
    url = key;                       // 浏览器缓存已足够，不重复下载
    state.cache.set(key, url);
    if(state.cache.size > 40){ const k=state.cache.keys().next().value; state.cache.delete(k); }
  }
  const im = $('slice');
  im.onload = ()=>{ im.style.display='block'; $('ph').style.display='none'; };
  im.src = url;

  // 预取相邻 4 层，滚动更顺
  for(const dz of [-2,-1,1,2]){
    const zz=z+dz; if(zz<0||zz>=state.n) continue;
    const pre=new Image(); pre.src = sliceURL(zz);
  }
  highlightStrip(z);
}

/* ---------------- 缩略图条 ---------------- */
function buildStrips(){
  const box=$('strips'); box.innerHTML='';
  const step = Math.max(1, Math.floor(state.n/40));
  for(let z=0; z<state.n; z+=step){
    const img=document.createElement('img');
    img.dataset.z=z;
    img.src=`/api/case/${state.caseId}/slice/${z}?mode=fill&alpha=0.35&wl=40&ww=400`;
    img.loading='lazy';
    img.onclick=()=>loadSlice(z);
    box.appendChild(img);
  }
}
function highlightStrip(z){
  document.querySelectorAll('#strips img').forEach(im=>{
    const dz=Math.abs(+im.dataset.z - z);
    im.classList.toggle('cur', dz < 8);
  });
}

/* ---------------- 病例加载 ---------------- */
async function useCase(caseId){
  state.caseId=caseId; state.cache.clear();
  const info = await (await fetch(`/api/case/${caseId}/status`)).json();
  if(info.status!=='done'){ toast('该病例尚未处理完成'); return; }
  state.n=info.n_slices;
  $('zSlider').max=state.n-1; $('zSlider').disabled=false;
  // 非 CT 或层数异常时显示警告横幅
  if(info.warning){
    $('warntext').textContent = info.warning;
    $('warnbar').classList.add('on');
  }else{
    $('warnbar').classList.remove('on');
  }
  const srcTag = info.mask_source === 'ground_truth' ? ' · 【参考标注预览】' : ' · 【模型预测】';
  $('modelInfo').textContent = `${info.name} · ${info.shape.join('×')} · ${info.spacing[0]}mm${srcTag}`;
  renderOrgans(info.organs_by_id);
  $('organSec').style.display='block';
  buildStrips();
  // 打开时停在器官最丰富的层，而不是机械的一半处
  loadSlice(info.best_slice != null ? info.best_slice : Math.floor(state.n*0.5));
  toast(`已载入：${info.name}`);
}

const ORGAN_CN={1:'脾脏',2:'右肾',3:'左肾',4:'胆囊',5:'食管',6:'肝脏',7:'胃',8:'主动脉',
  9:'下腔静脉',10:'胰腺',11:'右肾上腺',12:'左肾上腺',13:'十二指肠',14:'膀胱',15:'前列腺/子宫'};
// 配色从后端 /api/palette 获取（唯一数据源 configs/labels.yaml）。
// 这里的默认值仅在后端不可达时兜底，实际运行时会被覆盖。
let PALETTE={1:'#ff6b6b',2:'#48dbfb',3:'#2ed573',4:'#ffa502',5:'#b4b4b4',6:'#4ecdc4',
  7:'#ffc312',8:'#ff79c6',9:'#6495ed',10:'#a078ff',11:'#c74cff',12:'#ffd600',
  13:'#8cc878',14:'#ffdc78',15:'#c8a0dc'};
(async ()=>{
  try{
    const r = await (await fetch('/api/palette')).json();
    const p = {};
    for(const [k,v] of Object.entries(r.palette||{})) p[+k] = v.hex;
    if(Object.keys(p).length) PALETTE = p;
  }catch(e){ /* 保留兜底配色 */ }
})();

function renderOrgans(byId){
  const box=$('organList'); box.innerHTML='';
  const entries = Object.entries(byId).sort((a,b)=>b[1]-a[1]);
  if(!entries.length){ box.innerHTML='<div style="color:var(--dim);font-size:13px">未识别到器官</div>'; return; }
  for(const [cid, vol] of entries){
    const d=document.createElement('div'); d.className='organ';
    d.innerHTML=`<span class="swatch" style="background:${PALETTE[cid]||'#888'}"></span>
      <span class="nm">${ORGAN_CN[cid]||('类'+cid)}</span>
      <span class="vol">${vol.toFixed(0)} mL</span>`;
    box.appendChild(d);
  }
}

/* ---------------- 上传 ---------------- */
async function upload(file){
  const fd=new FormData(); fd.append('file', file);
  $('progWrap').style.display='block'; $('prog').style.width='3%';
  $('status').textContent='上传中 ...';
  let r;
  try{ r = await (await fetch('/api/upload',{method:'POST',body:fd})).json(); }
  catch(e){ toast('上传失败'); $('status').textContent='上传失败'; return; }
  if(!r.case_id){ toast('服务端拒绝'); return; }
  poll(r.case_id);
}

async function poll(caseId){
  const t0=Date.now();
  const tick = async ()=>{
    const info = await (await fetch(`/api/case/${caseId}/status`)).json();
    $('prog').style.width = Math.max(3, info.progress*100)+'%';
    $('status').textContent = `${info.message}  (${info.status})`;
    if(info.status==='done'){ await useCase(caseId); $('status').textContent=`完成，用时 ${info.elapsed}s`; return; }
    if(info.status==='error'){ $('status').textContent='处理失败：'+info.error; toast('处理失败'); return; }
    if(Date.now()-t0 > 600000){ $('status').textContent='超时'; return; }
    setTimeout(tick, 700);
  };
  tick();
}

/* ---------------- 事件绑定 ---------------- */
$('drop').onclick=()=>$('file').click();
$('file').onchange=e=>{ if(e.target.files[0]) upload(e.target.files[0]); };
['dragenter','dragover'].forEach(ev=>$('drop').addEventListener(ev,e=>{
  e.preventDefault(); $('drop').classList.add('over'); }));
['dragleave','drop'].forEach(ev=>$('drop').addEventListener(ev,e=>{
  e.preventDefault(); $('drop').classList.remove('over'); }));
$('drop').addEventListener('drop',e=>{
  const f=e.dataTransfer.files[0]; if(f) upload(f); });

$('zSlider').oninput=e=>loadSlice(+e.target.value);
$('stage').addEventListener('wheel',e=>{
  if(!state.caseId) return; e.preventDefault();
  loadSlice(state.z + (e.deltaY>0?1:-1));
},{passive:false});
document.addEventListener('keydown',e=>{
  if(!state.caseId) return;
  if(e.key==='ArrowDown'||e.key==='ArrowRight'){ e.preventDefault(); loadSlice(state.z+1); }
  if(e.key==='ArrowUp'||e.key==='ArrowLeft'){ e.preventDefault(); loadSlice(state.z-1); }
});

$('modeSeg').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  [...$('modeSeg').children].forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); state.mode=b.dataset.v; loadSlice(state.z);
};
$('alpha').oninput=e=>{ state.alpha=+e.target.value;
  $('alphaV').textContent=state.alpha.toFixed(2); loadSlice(state.z); };
$('wl').oninput=e=>{ state.wl=+e.target.value; $('wlV').textContent=`${state.wl} / ${state.ww}`; loadSlice(state.z); };
$('ww').oninput=e=>{ state.ww=+e.target.value; $('wlV').textContent=`${state.wl} / ${state.ww}`; loadSlice(state.z); };
$('showMask').onchange=e=>{ state.showMask=e.target.checked; loadSlice(state.z); };
document.querySelectorAll('[data-win]').forEach(c=>c.onclick=()=>{
  const [a,b]=c.dataset.win.split(',').map(Number);
  state.wl=a; state.ww=b; $('wl').value=a; $('ww').value=b;
  $('wlV').textContent=`${a} / ${b}`; loadSlice(state.z);
});

/* 演示病例 */
(async ()=>{
  try{
    const r = await (await fetch('/api/demo_cases')).json();
    const box=$('demoList');
    for(const c of r.cases){
      const s=document.createElement('span'); s.className='chip'; s.textContent=c.id;
      s.onclick=async ()=>{
        s.textContent='载入中...';
        const rr = await (await fetch(`/api/case/from_cache/${c.id}`,{method:'POST'})).json();
        if(rr.case_id) await useCase(rr.case_id);
        s.textContent=c.id;
      };
      box.appendChild(s);
    }
  }catch(e){}
})();
</script>
</body>
</html>
